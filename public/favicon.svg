<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <!-- Background: premium near-black -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0D1117"/>
      <stop offset="100%" stop-color="#161C24"/>
    </linearGradient>

    <!-- Slash: matches the nav logo gradient-text (Arctic primary → accent) -->
    <linearGradient id="slash" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#0891B2"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>

    <!-- Glow behind the slash -->
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background pill -->
  <rect width="100" height="100" rx="22" fill="url(#bg)"/>

  <!-- Hairline border — barely visible, adds definition -->
  <rect width="100" height="100" rx="22" fill="none" stroke="#22D3EE" stroke-width="1.5" opacity="0.1"/>

  <!-- The / — geometric parallelogram for pixel-perfect crispness at any size -->
  <polygon
    points="15,80 27,80 51,20 39,20"
    fill="url(#slash)"
    filter="url(#glow)"
  />

  <!-- The b — warm white, Courier New for monospace feel -->
  <text
    x="53" y="79"
    font-family="'Courier New', Courier, monospace"
    font-size="57"
    font-weight="700"
    fill="#F0F4FF"
  >b</text>

  <!-- Terminal cursor — matches the slash accent colour -->
  <rect x="87" y="50" width="5" height="28" rx="1.5" fill="#22D3EE" opacity="0.65"/>
</svg>
