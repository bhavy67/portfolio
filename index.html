<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Canonical — collapses www/non-www/http duplicates into one ranking signal -->
    <link rel="canonical" href="https://bhavyladani.vercel.app/" />

    <!-- ═══════════════════════════════════════════════
         PRIMARY META
    ═══════════════════════════════════════════════ -->
    <title>Bhavy Ladani | Product Engineer & Full Stack Developer</title>
    <meta name="description" content="Bhavy Ladani is a Product Engineer from Ahmedabad with 4+ years building full-stack web apps in React, Node.js, and TypeScript. Open to opportunities." />
    <meta name="author" content="Bhavy Ladani" />
    <!-- max-image-preview:large unlocks full-size image previews in Google Search -->
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />

    <!-- ═══════════════════════════════════════════════
         OPEN GRAPH  (LinkedIn, Slack, Discord, Facebook…)
    ═══════════════════════════════════════════════ -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://bhavyladani.vercel.app/" />
    <meta property="og:site_name" content="Bhavy Ladani" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:title" content="Bhavy Ladani | Product Engineer & Full Stack Developer" />
    <meta property="og:description" content="Bhavy Ladani is a Product Engineer from Ahmedabad with 4+ years building full-stack web apps in React, Node.js, and TypeScript. Open to opportunities." />
    <meta property="og:image" content="https://bhavyladani.vercel.app/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:alt" content="Bhavy Ladani — Product Engineer & Full Stack Developer" />

    <!-- ═══════════════════════════════════════════════
         TWITTER / X CARD  (spec uses name=, not property=)
    ═══════════════════════════════════════════════ -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://bhavyladani.vercel.app/" />
    <meta name="twitter:title" content="Bhavy Ladani | Product Engineer & Full Stack Developer" />
    <meta name="twitter:description" content="Bhavy Ladani is a Product Engineer from Ahmedabad with 4+ years building full-stack web apps in React, Node.js, and TypeScript." />
    <meta name="twitter:image" content="https://bhavyladani.vercel.app/og-image.jpg" />
    <meta name="twitter:image:alt" content="Bhavy Ladani — Product Engineer & Full Stack Developer" />

    <!-- Theme colour — matches Arctic primary -->
    <meta name="theme-color" content="#0891B2" />

    <!-- Preconnect to font origins so they don't block render -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    ═══════════════════════════════════════════════ -->
